<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TwinCue</title>
    <style>
      body { width: 300px; margin: 0; padding: 14px; color: #202124; font: 13px/1.45 Arial, sans-serif; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      label { display: block; margin: 10px 0 4px; font-weight: 600; }
      select { box-sizing: border-box; width: 100%; padding: 7px; border: 1px solid #c7c7c7; border-radius: 5px; background: #fff; }
      .toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; }
      .detected { margin-top: 6px; color: #5f6368; font-size: 12px; }
      #status { margin-top: 12px; padding: 8px; border-radius: 5px; background: #f1f3f4; word-break: break-word; }
      #status[data-state="ready"] { background: #e6f4ea; color: #137333; }
      #status[data-state="error"] { background: #fce8e6; color: #a50e0e; }
      .hint { margin-top: 9px; color: #666; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1 data-i18n="title"></h1>
    <label for="uiLanguage" data-i18n="uiLanguage"></label>
    <select id="uiLanguage">
      <option value="zh-CN">中文</option>
      <option value="en">English</option>
    </select>
    <label class="toggle"><input id="enabled" type="checkbox"><span data-i18n="enabled"></span></label>
    <label data-i18n="sourceLanguage"></label>
    <select id="sourceLanguage" disabled>
      <option value="auto" data-i18n="autoDetect"></option>
    </select>
    <div id="detected" class="detected"></div>
    <label for="sourceKind" data-i18n="sourceKind"></label>
    <select id="sourceKind"></select>
    <label for="targetLanguage" data-i18n="targetLanguage"></label>
    <select id="targetLanguage"></select>
    <div id="status" data-i18n="waiting"></div>
    <div class="hint" data-i18n="hint"></div>
    <script src="popup.js"></script>
  </body>
</html>
